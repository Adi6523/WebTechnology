<div class="container mt-4 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>{{ isEditMode ? 'Edit' : 'Add' }} Student</h2>
        <a routerLink="/students" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Back to List</a>
      </div>

      <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i> {{ successMessage }}
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <form [formGroup]="studentForm" (ngSubmit)="onSubmit()">
            
            <!-- Name -->
            <div class="mb-3">
              <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-user text-muted"></i></span>
                <input type="text" id="name" formControlName="name" class="form-control border-start-0" 
                       [ngClass]="{ 'is-invalid': submitted && f['name'].errors }" placeholder="e.g. John Doe">
              </div>
              <div *ngIf="submitted && f['name'].errors" class="text-danger mt-1 small">
                <div *ngIf="f['name'].errors['required']">Name is required</div>
                <div *ngIf="f['name'].errors['minlength']">Name must be at least 2 characters</div>
              </div>
            </div>

            <div class="row">
              <!-- Age -->
              <div class="col-md-6 mb-3">
                <label for="age" class="form-label">Age <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-calendar-alt text-muted"></i></span>
                  <input type="number" id="age" formControlName="age" class="form-control border-start-0" 
                         [ngClass]="{ 'is-invalid': submitted && f['age'].errors }" placeholder="e.g. 20">
                </div>
                <div *ngIf="submitted && f['age'].errors" class="text-danger mt-1 small">
                  <div *ngIf="f['age'].errors['required']">Age is required</div>
                  <div *ngIf="f['age'].errors['min']">Age must be greater than 0</div>
                </div>
              </div>

              <!-- Marks -->
              <div class="col-md-6 mb-3">
                <label for="marks" class="form-label">Marks (%) <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-percentage text-muted"></i></span>
                  <input type="number" id="marks" formControlName="marks" class="form-control border-start-0" 
                         [ngClass]="{ 'is-invalid': submitted && f['marks'].errors }" placeholder="0-100">
                </div>
                <div *ngIf="submitted && f['marks'].errors" class="text-danger mt-1 small">
                  <div *ngIf="f['marks'].errors['required']">Marks are required</div>
                  <div *ngIf="f['marks'].errors['min'] || f['marks'].errors['max']">Marks must be between 0 and 100</div>
                </div>
              </div>
            </div>

            <!-- Course -->
            <div class="mb-4">
              <label for="course" class="form-label">Course <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-graduation-cap text-muted"></i></span>
                <select id="course" formControlName="course" class="form-select border-start-0" 
                        [ngClass]="{ 'is-invalid': submitted && f['course'].errors }">
                  <option value="" disabled selected>Select a course</option>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electronics">Electronics</option>
                  <option value="Mechanical">Mechanical</option>
                  <option value="Civil">Civil</option>
                </select>
              </div>
              <div *ngIf="submitted && f['course'].errors" class="text-danger mt-1 small">
                <div *ngIf="f['course'].errors['required']">Course is required</div>
              </div>
            </div>

            <!-- Submit Button -->
            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas" [ngClass]="isEditMode ? 'fa-save' : 'fa-check'"></i>
                {{ isEditMode ? 'Update Student' : 'Save Student' }}
              </button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
